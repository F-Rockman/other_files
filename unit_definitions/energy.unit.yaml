- description: joule is the reference unit of energy
  description_cn: 焦耳是能量的基准单位
  is_standard: 'Y'
  name: joule
  name_cn: 焦耳
  standard_conversion_rule: '1'
  unit_symbol: 'J'
  unit_type: energy
  unit_type_cn: 能量

- description: kilojoule is a unit of energy
  description_cn: 千焦耳是能量的单位
  is_standard: 'N'
  name: kilojoule
  name_cn: 千焦耳
  standard_conversion_rule: '1000'
  unit_symbol: 'kJ'
  unit_type: energy
  unit_type_cn: 能量

- description: watt-hour is an IEC-standardized non-SI unit of energy
  description_cn: 瓦时是IEC标准化的非国际单位制能量单位
  is_standard: 'N'
  name: watt_hour
  name_cn: 瓦特小时
  standard_conversion_rule: '3600'
  unit_symbol: 'Wh'
  unit_type: energy
  unit_type_cn: 能量

- description: kilowatt-hour is an IEC-standardized non-SI unit of energy
  description_cn: 千瓦时是IEC标准化的非国际单位制能量单位
  is_standard: 'N'
  name: kilowatt_hour
  name_cn: 千瓦时
  standard_conversion_rule: '3600000'
  unit_symbol: 'kWh'
  unit_type: energy
  unit_type_cn: 能量

- description: nutritional kilocalorie, defined as exactly 4184 joules, is a non-SI unit specified by the Codex Alimentarius nutrition labelling standard
  description_cn: 营养千卡精确等于4184焦耳，是食品法典营养标签标准规定使用的非国际单位制能量单位
  is_standard: 'N'
  name: kilocalorie
  name_cn: 千卡
  standard_conversion_rule: '4184'
  unit_symbol: 'kcal'
  unit_type: energy
  unit_type_cn: 能量
